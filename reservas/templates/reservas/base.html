<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}BarberClub{% endblock %}</title>
<style>
:root{--ink:#1d1d1f;--muted:#6b6b70;--line:#e3e1dc;--bg:#f7f5f1;--acc:#7a3e1d;--ok:#1f7a4a;--err:#b3261e}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{background:#1d1d1f;color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center}
header a{color:#fff;text-decoration:none;margin-left:18px;font-size:14px}.logo{font-weight:700;letter-spacing:.5px}
main{max-width:920px;margin:24px auto;padding:0 16px}h1{font-size:22px;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 20px;font-size:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:14px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:8px 14px;font-size:14px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.sec{background:#fff;color:var(--acc);border:1px solid var(--acc)}.btn.danger{background:var(--err)}
.slots{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.slots a{padding:6px 12px;border:1px solid var(--acc);border-radius:6px;color:var(--acc);text-decoration:none;font-size:14px}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}input,select{padding:7px;border:1px solid var(--line);border-radius:6px;font-size:14px}
form.filtros{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.msg{padding:10px 14px;border-radius:6px;margin-bottom:14px;font-size:14px}.msg.success{background:#e6f4ec;color:var(--ok)}.msg.error{background:#fbe9e7;color:var(--err)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
.estado{font-size:12px;padding:2px 8px;border-radius:10px;background:#eee}.CONFIRMADA{background:#e6f4ec;color:var(--ok)}.CANCELADA,.PAGO_RECHAZADO{background:#fbe9e7;color:var(--err)}.PENDIENTE_PAGO{background:#fff4d6;color:#8a5a00}
.paso{font-size:12px;color:var(--acc);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
</style></head><body>
<header><span class="logo">💈 BarberClub</span>
{% if user.is_authenticated %}<nav><a href="{% url 'disponibilidad' %}">Disponibilidad</a><a href="{% url 'mis_reservas' %}">Mis reservas</a>
<form method="post" action="{% url 'logout' %}" style="display:inline">{% csrf_token %}<button style="background:none;border:0;color:#fff;margin-left:18px;cursor:pointer">Salir ({{ user.username }})</button></form></nav>{% endif %}
</header><main>
{% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}
{% block content %}{% endblock %}</main></body></html>
